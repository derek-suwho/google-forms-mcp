[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "google-forms-mcp"
version = "0.3.0"
description = "MCP tools for drafting and creating native Google Forms"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.150.0",
  "google-auth-oauthlib>=1.2.1",
  "mcp>=2.0.0,<3",
  "pydantic>=2.10.0",
  "starlette>=0.47.0",
  "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14.0",
  "pytest>=8.3.0",
  "ruff>=0.9.0",
]

[project.scripts]
google-forms-mcp = "google_forms_mcp.server:main"
google-forms-connector = "google_forms_mcp.http_server:main"
google-forms-auth = "google_forms_mcp.auth:main"

[tool.hatch.build.targets.wheel]
packages = ["src/google_forms_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["google_forms_mcp"]

[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google_auth_oauthlib.*"]
ignore_missing_imports = true
