name: verify-and-publish-container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install locked toolchain
        run: pipx install uv==0.11.6

      - name: Run quality gates
        run: |
          uv sync --extra dev --frozen
          uv run pytest -q
          uv run ruff check .
          uv run mypy
          uv run ruff format --check .
          uv build

      - name: Build production image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/google-forms-mcp
        run: docker build --pull --tag "$IMAGE:${GITHUB_SHA}" --tag "$IMAGE:latest" .

      - name: Smoke-test production image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/google-forms-mcp
        run: |
          docker run --detach --rm --name forms-mcp-smoke \
            --publish 127.0.0.1:18000:8000 \
            --env GOOGLE_FORMS_MULTIUSER=true \
            --env GOOGLE_FORMS_PUBLIC_BASE_URL=https://forms.example.test \
            --env GOOGLE_FORMS_MULTIUSER_DATA_DIR=/data \
            --env GOOGLE_FORMS_CONNECTOR_HOST=0.0.0.0 \
            --env GOOGLE_FORMS_CONNECTOR_PUBLIC_HOSTS=127.0.0.1,localhost \
            --tmpfs /data:rw,noexec,nosuid,mode=0777,size=16m \
            "$IMAGE:${GITHUB_SHA}"
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18000/health; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              docker logs forms-mcp-smoke
              exit 1
            fi
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' \
            --data '{}' http://127.0.0.1:18000/mcp)" = "401"

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/google-forms-mcp
        run: |
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"

      - name: Stop smoke container
        if: always()
        run: docker stop forms-mcp-smoke 2>/dev/null || true
