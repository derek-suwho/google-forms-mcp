services:
  google-forms-mcp:
    image: ghcr.io/derek-suwho/google-forms-mcp@sha256:032be1334a3a57e8a872cacf2f04dcd0272bba8cb5862c7dadfbdadaf68f716b
    container_name: google-forms-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8767:8000"
    environment:
      GOOGLE_FORMS_MULTIUSER: "true"
      GOOGLE_FORMS_PUBLIC_BASE_URL: "https://google-forms-mcp.srv1913479.hstgr.cloud"
      GOOGLE_FORMS_WEB_CLIENT_ID: "${GOOGLE_FORMS_WEB_CLIENT_ID}"
      GOOGLE_FORMS_WEB_CLIENT_SECRET_VALUE: "${GOOGLE_FORMS_WEB_CLIENT_SECRET_VALUE}"
      GOOGLE_FORMS_GOOGLE_PROJECT_ID: "avian-osprey-506220-s1"
      GOOGLE_FORMS_MULTIUSER_DATA_DIR: "/var/lib/google-forms-mcp"
      GOOGLE_FORMS_CONNECTOR_HOST: "0.0.0.0"
      GOOGLE_FORMS_CONNECTOR_PUBLIC_HOSTS: "google-forms-mcp.srv1913479.hstgr.cloud"
      GOOGLE_FORMS_RATE_LIMIT_PER_MINUTE: "60"
      GOOGLE_FORMS_PUBLIC_RATE_LIMIT_PER_MINUTE: "10"
      GOOGLE_FORMS_PUBLIC_GLOBAL_RATE_LIMIT_PER_MINUTE: "120"
      GOOGLE_FORMS_TRUST_PROXY_HEADERS: "true"
      PORT: "8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.google-forms-mcp.entrypoints=websecure"
      - "traefik.http.routers.google-forms-mcp.rule=Host(`google-forms-mcp.srv1913479.hstgr.cloud`)"
      - "traefik.http.routers.google-forms-mcp.tls.certresolver=letsencrypt"
      - "traefik.http.services.google-forms-mcp.loadbalancer.server.port=8000"
    volumes:
      - /srv/google-forms-mcp/data:/var/lib/google-forms-mcp
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
